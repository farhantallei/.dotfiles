# =====================================================
# Core
# =====================================================
unbind C-b
set -g prefix C-s
bind C-s send-prefix

unbind r
bind r source-file ~/.tmux.conf

set -g mouse on
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:Tc"

# Extended keys (CSI u) — biar Shift+Enter, Ctrl+Tab, dll bisa dibedain
set -s extended-keys on
set -as terminal-features ',*:extkeys'

# =====================================================
# Quality of life
# =====================================================
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g focus-events on
set -g history-limit 50000
setw -g mode-keys vi

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# =====================================================
# Prefix bindings (Ctrl+s)
# =====================================================
bind w choose-tree -Zw
bind c new-window -c "#{pane_current_path}"
bind f display-popup -E -w 80% -h 80% "~/.local/bin/tmux-sessionizer --window"
bind F display-popup -E -w 80% -h 80% "~/.local/bin/tmux-sessionizer"

# Pane switch fallback (mirror Alt-* kalau Alt diintercept)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Swap window
bind < swap-window -t -1 \; select-window -t -1
bind > swap-window -t +1 \; select-window -t +1

# tmux defaults kept: prefix [ (copy-mode), , (rename-window), $ (rename-session), d (detach)

# =====================================================
# No-prefix — Alt-* (kerjaan harian)
# =====================================================
# Pane switch: DROPPED (2026-05-12) — M-h/j/k/l bentrok LazyVim (<A-j>/<A-k> move line dll);
# tmux intercept duluan jadi keystroke gak nyampe nvim. Pane switch sekarang full delegated
# ke Ctrl+h/j/k/l (vim-tmux-navigator, seamless ke nvim splits). Fallback: prefix h/j/k/l.
# bind -n M-h select-pane -L
# bind -n M-j select-pane -D
# bind -n M-k select-pane -U
# bind -n M-l select-pane -R

# Window jump (M-0 = window 10, base-index 1)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 10

# Window navigation
bind -n M-Tab last-window
bind -n M-S-Left previous-window
bind -n M-S-Right next-window
bind -n M-H previous-window
bind -n M-L next-window

# Window / pane management
bind -n M-c new-window -c "#{pane_current_path}"
bind -n M-C new-session -c "#{pane_current_path}"
bind -n M-f display-popup -E -w 80% -h 80% "~/.local/bin/tmux-sessionizer --window"
bind -n M-F display-popup -E -w 80% -h 80% "~/.local/bin/tmux-sessionizer"
bind -n M-g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"
bind -n M-Enter split-window -h -c "#{pane_current_path}"
bind -n M-S-Enter split-window -v -c "#{pane_current_path}"
bind -n M-x confirm-before -p "kill-pane #P? (y/n)" kill-pane

# Buka Finder di cwd pane aktif
bind -n M-o run-shell "cd '#{pane_current_path}' && open ."

# =====================================================
# Yazi flow (Ctrl+z, no-prefix)
# =====================================================
bind -n C-z if-shell '[ "#{pane_current_command}" = "yazi" ]' \
  'send-keys Z' \
  'send-keys Z Enter'

# =====================================================
# UI
# =====================================================
set-option -g status-position top
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""

# =====================================================
# Plugins (TPM)
# =====================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

# =====================================================
# Theme (variant driven by ~/.config/theme-current)
# =====================================================
# Map variant ke @catppuccin_flavor (plugin butuh valid Catppuccin name).
# Tokyonight pakai mocha sebagai placeholder — palette di-override manual
# setelah plugin load.
run-shell '\
  variant=$(cat ~/.config/theme-current 2>/dev/null || echo mocha); \
  case "$variant" in \
    tokyonight-*) cp_flavor=mocha ;; \
    *) cp_flavor=$variant ;; \
  esac; \
  tmux set -g @catppuccin_flavor "$cp_flavor"'
set -g @catppuccin_window_status_style "rounded"
# Force palette reset tiap re-source — plugin set @thm_* pakai flag -o
# ("set if not set"), tanpa reset palette stuck di flavor pertama.
set -g @catppuccin_reset "true"
set -g @catppuccin_date_time_text "%a %d %b %H:%M"

# Statusline modules
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag  status-right "#{E:@catppuccin_status_session}"
set -ag  status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set -ag  status-right "#{E:@catppuccin_status_date_time}"

# =====================================================
# TPM init (keep at bottom)
# =====================================================
run '~/.tmux/plugins/tpm/tpm'

# =====================================================
# Palette override (after plugin load) — single source of truth
# =====================================================
# Source palette manual untuk semua variant (Catppuccin + Tokyonight).
# Ini override palette plugin → konsisten antar-family.
run-shell 'tmux source-file ~/.config/tmux/palettes/$(cat ~/.config/theme-current 2>/dev/null || echo mocha).conf'

# Styling pakai #{E:@thm_*} lazy expand
set -g status-style "bg=#{E:@thm_bg},fg=#{E:@thm_fg}"
set -g window-status-format "#[bg=#{E:@thm_surface_1},fg=#{E:@thm_fg}] #I #T "
set -g window-status-current-format "#[bg=#{E:@thm_mauve},fg=#{E:@thm_crust}] #I #T "
