# vim:fileencoding=utf-8:foldmethod=marker

# : Manager {{{

[mgr]
cwd = { fg = "#118c74" }

# Find
find_keyword  = { fg = "#8c6c3e", bold = true, italic = true, underline = true }
find_position = { fg = "#9854f1", bg = "reset", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#587539", bg = "#587539" }
marker_cut      = { fg = "#f52a65", bg = "#f52a65" }
marker_marked   = { fg = "#118c74", bg = "#118c74" }
marker_selected = { fg = "#8c6c3e", bg = "#8c6c3e" }

# Count
count_copied   = { fg = "#e1e2e7", bg = "#587539" }
count_cut      = { fg = "#e1e2e7", bg = "#f52a65" }
count_selected = { fg = "#e1e2e7", bg = "#8c6c3e" }

# Border
border_symbol = "│"
border_style  = { fg = "#848cb5" }

# : }}}


# : Tabs {{{

[tabs]
active   = { fg = "#e1e2e7", bg = "#2e7de9", bold = true }
inactive = { fg = "#2e7de9", bg = "#c4c8da" }

# : }}}


# : Mode {{{

[mode]

normal_main = { fg = "#e1e2e7", bg = "#2e7de9", bold = true }
normal_alt  = { fg = "#2e7de9", bg = "#c4c8da" }

# Select mode
select_main = { fg = "#e1e2e7", bg = "#118c74", bold = true }
select_alt  = { fg = "#118c74", bg = "#c4c8da" }

# Unset mode
unset_main = { fg = "#e1e2e7", bg = "#c64343", bold = true }
unset_alt  = { fg = "#c64343", bg = "#c4c8da" }

# : }}}


# : Status bar {{{

[status]
# Permissions
perm_sep   = { fg = "#848cb5" }
perm_type  = { fg = "#2e7de9" }
perm_read  = { fg = "#8c6c3e" }
perm_write = { fg = "#f52a65" }
perm_exec  = { fg = "#587539" }

# Progress
progress_label  = { fg = "#3760bf", bold = true }
progress_normal = { fg = "#587539", bg = "#a8aecb" }
progress_error  = { fg = "#8c6c3e", bg = "#f52a65" }

# : }}}


# : Pick {{{

[pick]
border   = { fg = "#2e7de9" }
active   = { fg = "#9854f1", bold = true }
inactive = {}

# : }}}


# : Input {{{

[input]
border   = { fg = "#2e7de9" }
title    = {}
value    = {}
selected = { reversed = true }

# : }}}


# : Completion {{{

[cmp]
border = { fg = "#2e7de9" }

# : }}}


# : Tasks {{{

[tasks]
border  = { fg = "#2e7de9" }
title   = {}
hovered = { fg = "#9854f1", bold = true }

# : }}}


# : Which {{{

[which]
mask            = { bg = "#c4c8da" }
cand            = { fg = "#118c74" }
rest            = { fg = "#68709a" }
desc            = { fg = "#9854f1" }
separator       = "  "
separator_style = { fg = "#a1a6c5" }

# : }}}


# : Help {{{

[help]
on      = { fg = "#118c74" }
run     = { fg = "#9854f1" }
hovered = { reversed = true, bold = true }
footer  = { fg = "#c4c8da", bg = "#3760bf" }

# : }}}


# : Spotter {{{

[spot]
border   = { fg = "#2e7de9" }
title    = { fg = "#2e7de9" }
tbl_col  = { fg = "#118c74" }
tbl_cell = { fg = "#9854f1", bg = "#a8aecb" }

# : }}}


# : Notification {{{

[notify]
title_info  = { fg = "#587539" }
title_warn  = { fg = "#8c6c3e" }
title_error = { fg = "#f52a65" }

# : }}}


# : File-specific styles {{{

[filetype]

rules = [
	# Image
	{ mime = "image/*", fg = "#118c74" },
	# Media
	{ mime = "{audio,video}/*", fg = "#8c6c3e" },
	# Archive
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#9854f1" },
	# Document
	{ mime = "application/{pdf,doc,rtf}", fg = "#587539" },
	# Virtual file system
	{ mime = "vfs/{absent,stale}", fg = "#68709a" },
	# Fallback
	{ url = "*", fg = "#3760bf" },
	{ url = "*/", fg = "#2e7de9" },
]

# : }}}

[icon]

dirs = [
	{ name = ".config", text = "", fg = "#9854f1" },
	{ name = ".git", text = "", fg = "#118c74" },
	{ name = ".github", text = "", fg = "#2e7de9" },
	{ name = ".npm", text = "", fg = "#2e7de9" },
	{ name = "Desktop", text = "", fg = "#118c74" },
	{ name = "Development", text = "", fg = "#118c74" },
	{ name = "Documents", text = "", fg = "#118c74" },
	{ name = "Downloads", text = "", fg = "#118c74" },
	{ name = "Library", text = "", fg = "#118c74" },
	{ name = "Movies", text = "", fg = "#118c74" },
	{ name = "Music", text = "", fg = "#118c74" },
	{ name = "Pictures", text = "", fg = "#118c74" },
	{ name = "Public", text = "", fg = "#118c74" },
	{ name = "Videos", text = "", fg = "#118c74" },
]
conds = [
	# Special files
	{ if = "orphan", text = "", fg = "#3760bf" },
	{ if = "link", text = "", fg = "#848cb5" },
	{ if = "block", text = "", fg = "#c64343" },
	{ if = "char", text = "", fg = "#c64343" },
	{ if = "fifo", text = "", fg = "#c64343" },
	{ if = "sock", text = "", fg = "#c64343" },
	{ if = "sticky", text = "", fg = "#c64343" },
	{ if = "dummy", text = "", fg = "#f52a65" },

	# Fallback
	{ if = "dir & hovered", text = "", fg = "#2e7de9" },
	{ if = "dir", text = "", fg = "#2e7de9" },
	{ if = "exec", text = "", fg = "#587539" },
	{ if = "!dir", text = "", fg = "#3760bf" },
]
