[mgr]
ratio          = [1, 4, 3]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
sort_translit  = false
linemode       = "size"
show_hidden    = false
show_symlink   = true
scrolloff      = 5
mouse_events   = ["click", "scroll"]
title_format   = "Yazi: {cwd}"

[preview]
wrap          = "no"
tab_size      = 2
max_width     = 600
max_height    = 900
image_delay   = 30
image_filter  = "lanczos3"
image_quality = 75

[tasks]
micro_workers    = 10
macro_workers    = 5
bizarre_retry    = 3
suppress_preload = false

[opener]
edit = [
  { run = '$EDITOR "$@"', block = true, for = "unix" },
]
open = [
  { run = 'open "$@"', desc = "Open", for = "macos" },
]
reveal = [
  { run = 'open -R "$1"', desc = "Reveal in Finder", for = "macos" },
]
extract = [
  { run = 'ya pub extract --list "$@"', desc = "Extract here" },
]

[open]
prepend_rules = [
  { url = "*.md",   use = ["edit", "open"] },
  { url = "*.json", use = ["edit", "open"] },
]
append_rules = [
  { url = "*", use = "open" },
]
